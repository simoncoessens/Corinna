# Render Blueprint for Corinna. Deploy with one click:
#   https://render.com/deploy?repo=https://github.com/simoncoessens/Corinna
# Render creates both services and asks for every value marked `sync: false`.
# Nothing secret is stored in git.

services:
  - type: web
    name: corinna-uniba-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY        # openrouter.ai -> Keys (LLM calls)
        sync: false
      - key: TAVILY_API_KEY            # app.tavily.com (web search)
        sync: false
      - key: OPENAI_EMBEDDING_API_KEY  # platform.openai.com (embeddings only)
        sync: false
      - key: QDRANT_URL                # Qdrant Cloud cluster URL
        sync: false
      - key: QDRANT_API_KEY            # Qdrant Cloud API key
        sync: false
      - key: DATABASE_URL              # Supabase -> Connect -> Session pooler
        sync: false
      - key: ADMIN_PASSWORD            # choose one; admin dashboard login
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENROUTER_MAX_TOKENS
        value: "16384"

  - type: web
    name: corinna-uniba
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    healthCheckPath: /
    envVars:
      # Must match the backend URL shown in Render after creation.
      - key: NEXT_PUBLIC_API_URL
        value: https://corinna-uniba-backend.onrender.com
